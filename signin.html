{% extends "base.html" %}
{% block title %}Sign In | Career & GATE Planner{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon">🎯</div>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue your GATE preparation.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn primary">Sign in</button>
    </form>
    <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
  </div>
</section>
{% endblock %}
