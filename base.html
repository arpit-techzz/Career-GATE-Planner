<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Career & GATE Planner{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">🎯 Career & GATE Planner</div>
  <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/syllabus">Syllabus</a></li>
    <li><a href="/tasks">Tasks</a></li>
    <li><a href="/career">Career Goals</a></li>
    <li><button class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button></li>
  </ul>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>Built with ❤️ for GATE aspirants | © 2026 Career & GATE Planner</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
